<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien</title>
    <style>
       body{
        background-color: darkgoldenrod;
       } 
       #kepek{
        width: 300px;
        margin: 0px auto;
        background-color: white;
        border: 1px solid black;
        padding: 10px;
       }
    </style>
    <script>
        function csere(id,kep){
            document.getElementById(id).src = kep;
        }
    </script>
</head>
<body>

    <div id="kepek">
        <img src="alien1.png" id="kep1" onmouseenter="csere('kep1', 'alien2.png');" onmouseleave="csere('kep1', 'alien1.png');">
        <img src="alien2.png" id="kep2" onmouseenter="csere('kep2', 'alien3.png');" onmouseleave="csere('kep2', 'alien2.png');">
        <img src="alien3.png" id="kep3" onmouseenter="csere('kep3', 'alien4.png');" onmouseleave="csere('kep3', 'alien3.png');">
        
    </div>
    
</body>
</html>
